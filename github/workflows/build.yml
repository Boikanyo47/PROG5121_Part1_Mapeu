name: Maven Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          check-latest: true
          cache: maven

      - name: Check Java version
        run: |
          java --version
          javac --version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Build with Maven
        run: mvn -B clean package
        